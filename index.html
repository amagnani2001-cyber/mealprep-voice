<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MealPrep Voice</title>

<style>

body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f5f5f5;
    padding-top:50px;
}

h1{
    color:#333;
}

button{
    background:#2196F3;
    color:white;
    border:none;
    padding:20px 40px;
    font-size:24px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#1976D2;
}

#annullaBtn{
    display:none;
    margin-top:15px;
    background:#d32f2f;
}

#annullaBtn:hover{
    background:#b71c1c;
}

#testo{
    margin-top:30px;
    font-size:24px;
    font-weight:bold;
    color:#222;
}

#stato{
    margin-top:20px;
    font-size:20px;
    color:green;
}

#countdown{
    margin-top:15px;
    font-size:18px;
    color:#ff6f00;
    font-weight:bold;
}

</style>
</head>

<body>

<h1>MealPrep Voice</h1>

<button onclick="startVoice()">🎤 Parla</button>

<div id="testo"></div>
<div id="countdown"></div>
<div id="stato"></div>

<div
    id="report"
    style="
    display:none;
    max-width:600px;
    margin:30px auto;
    text-align:left;
    background:white;
    border-radius:10px;
    padding:15px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
">
</div>

<button id="annullaBtn" onclick="annullaInvio()">
❌ ANNULLA
</button>

<script>

const WEBHOOK =
"https://script.google.com/macros/s/AKfycbxIui9VudClKRLR1ENnuuGGIylPYs5xQE0BGcSAWms/exec";

const REPORT_API = WEBHOOK;

let timerInvio = null;
let timerCountdown = null;
let comandoDaInviare = "";

function startVoice(){

    if(
        comandoDaInviare !== "" &&
        timerInvio !== null
    ){

        clearTimeout(timerInvio);
        clearInterval(timerCountdown);

        const comandoPrecedente =
            comandoDaInviare;

        comandoDaInviare = "";

        inviaComando(comandoPrecedente);

        return;
    }

    document.getElementById("stato").innerText =
        "🎤 Microfono attivo...";

    document.getElementById("countdown").innerText = "";
    document.getElementById("testo").innerText = "";

    const recognition =
        new webkitSpeechRecognition();

    recognition.lang = "it-IT";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = function(event){

        comandoDaInviare =
            event.results[0][0].transcript.trim();

        document.getElementById("testo").innerText =
            comandoDaInviare;

        document.getElementById("stato").innerText =
            "Comando riconosciuto";

        document.getElementById("annullaBtn").style.display =
            "inline-block";

        let secondi = 5;

        document.getElementById("countdown").innerText =
            "Invio automatico tra 5 secondi";

        timerCountdown = setInterval(function(){

            secondi--;

            if(secondi > 0){

                document.getElementById("countdown").innerText =
                    "Invio automatico tra " +
                    secondi +
                    " secondi";

            }
            else{

                clearInterval(timerCountdown);

                document.getElementById("countdown").innerText =
                    "Invio in corso...";

            }

        },1000);

        timerInvio = setTimeout(function(){

            inviaComando(comandoDaInviare);

        },5000);

    };

    recognition.onerror = function(event){

        document.getElementById("stato").innerText =
            "❌ Errore microfono: " +
            event.error;

    };

    recognition.start();

}

function annullaInvio(){

    clearTimeout(timerInvio);
    clearInterval(timerCountdown);

    timerInvio = null;
    timerCountdown = null;
    comandoDaInviare = "";

    document.getElementById("countdown").innerText =
        "❌ Invio annullato";

    document.getElementById("stato").innerText = "";

    document.getElementById("annullaBtn").style.display =
        "none";

}

async function mostraListaSpesa(){

    try{

        const response =
            await fetch(
                REPORT_API +
                "?action=shopping"
            );

        const dati =
            await response.json();

        let html =
            "<h2>🛒 Lista Spesa</h2>";

        if(dati.elementi.length === 0){

            html +=
                "<p>Nessun prodotto da acquistare.</p>";

        }

        dati.elementi.forEach(item => {

            html += `
                <div style="margin:10px 0;">
                    <label>
                        <input type="checkbox">
                        ${item}
                    </label>
                </div>
            `;

        });

        document.getElementById("report").innerHTML =
            html;

        document.getElementById("report").style.display =
            "block";

    }
    catch(err){

        document.getElementById("stato").innerText =
            "❌ Errore caricamento lista spesa";

    }

}

async function mostraMealPrep(){

    try{

        const response =
            await fetch(
                REPORT_API +
                "?action=mealprep"
            );

        const dati =
            await response.json();

        let html =
            "<h2>🍱 Meal Prep</h2>";

        if(dati.elementi.length === 0){

            html +=
                "<p>Nessuna ricetta in attesa.</p>";

        }

        dati.elementi.forEach(item => {

            html += `
                <div style="margin:10px 0;">
                    <label>
                        <input type="checkbox">
                        ${item}
                    </label>
                </div>
            `;

        });

        document.getElementById("report").innerHTML =
            html;

        document.getElementById("report").style.display =
            "block";

    }
    catch(err){

        document.getElementById("stato").innerText =
            "❌ Errore caricamento meal prep";

    }

}

async function inviaComando(comando){

    clearTimeout(timerInvio);
    clearInterval(timerCountdown);

    document.getElementById("countdown").innerText = "";
    document.getElementById("annullaBtn").style.display = "none";

    document.getElementById("stato").innerText =
        "COMANDO: [" + comando + "]";

    const cmd =
        comando.toLowerCase().trim();

    if(cmd.includes("lista")){

        document.getElementById("stato").innerText =
            "RILEVATO LISTA SPESA";

        await mostraListaSpesa();

        return;
    }

    if(cmd.includes("meal")){

        document.getElementById("stato").innerText =
            "RILEVATO MEAL PREP";

        await mostraMealPrep();

        return;
    }

    document.getElementById("stato").innerText =
        "NON RICONOSCIUTO: " + cmd;
}

    if(
        comando.toLowerCase() ===
        "report lista spesa"
    ){

        await mostraListaSpesa();

        document.getElementById("stato").innerText =
            "🛒 Report generato";

        return;

    }

    if(
        comando.toLowerCase() ===
        "report meal prep"
    ){

        await mostraMealPrep();

        document.getElementById("stato").innerText =
            "🍱 Report generato";

        return;

    }

    try{

        await fetch(WEBHOOK,{

            method:"POST",
            mode:"no-cors",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                utente:"Andrea",
                comando:comando
            })

        });

        document.getElementById("stato").innerText =
            "✅ Comando inviato";

    }
    catch(err){

        document.getElementById("stato").innerText =
            "❌ Errore invio";

    }

    comandoDaInviare = "";

}

</script>

</body>
</html>
