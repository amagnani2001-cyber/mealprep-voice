<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealPrep Voice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #1976D2;
        }

        #testo {
            margin-top: 30px;
            font-size: 22px;
            color: #222;
        }

        #stato {
            margin-top: 20px;
            font-size: 18px;
            color: green;
        }
    </style>
</head>

<body>

    <h1>MealPrep Voice</h1>

    <button onclick="startVoice()">🎤 Parla</button>

    <div id="testo"></div>
    <div id="stato"></div>

    <script>

        const WEBHOOK = "https://script.google.com/macros/s/AKfycbxIui9VudClKRLR1ENnuuGGIylPYs5xQE0BGcSAWms/exec";

        function startVoice() {

            document.getElementById("stato").innerText =
                "🎤 Microfono attivo...";

            const recognition =
                new webkitSpeechRecognition();

            recognition.lang = "it-IT";
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = async function (event) {

                const comando =
                    event.results[0][0].transcript;

                alert("Hai detto: " + comando);

                document.getElementById("testo").innerText =
                    comando;

                try {

                    const response =
                        await fetch(WEBHOOK, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                utente: "Andrea",
                                comando: comando
                            })
                        });

                    const risultato =
                        await response.text();

                    alert("Risposta server: " + risultato);

                    document.getElementById("stato").innerText =
                        "✅ Inviato";

                }
                catch (errore) {

                    alert("Errore: " + errore);

                    document.getElementById("stato").innerText =
                        "❌ Errore";

                }
            };

            recognition.onerror = function (event) {

                alert("Errore microfono: " + event.error);

            };

            recognition.start();
        }

    </script>

</body>

</html>
